version: '3.9'

services:
  chorequest:
    image: ${DOCKER_IMAGE:-chorequest:latest}
    container_name: chorequest-app
    restart: always
    ports:
      - "${CHOREQUEST_PORT:-8080}:80"
    environment:
      - NODE_ENV=production
      - TZ=${TIMEZONE:-UTC}
    volumes:
      - chorequest-data:/usr/share/nginx/html/data
      - chorequest-backups:/backups:ro
      - ./custom-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - chorequest-network
    labels:
      - "com.chorequest.description=Family Chore Tracking Application"
      - "com.chorequest.version=1.0.0"
      - "com.chorequest.environment=production"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        compress: "true"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  backup:
    image: alpine:latest
    container_name: chorequest-backup
    restart: unless-stopped
    volumes:
      - chorequest-data:/data:ro
      - chorequest-backups:/backups
      - ./scripts:/scripts:ro
    environment:
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-7}
      - BACKUP_SCHEDULE=${BACKUP_SCHEDULE:-0 2 * * *}
      - TZ=${TIMEZONE:-UTC}
    command: >
      sh -c "
      apk add --no-cache dcron tar gzip &&
      echo '${BACKUP_SCHEDULE:-0 2 * * *} /scripts/backup.sh' > /etc/crontabs/root &&
      crond -f -l 2
      "
    networks:
      - chorequest-network
    labels:
      - "com.chorequest.service=backup"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  chorequest-network:
    driver: bridge
    name: chorequest-network

volumes:
  chorequest-data:
    name: chorequest-data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}
  chorequest-backups:
    name: chorequest-backups
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${BACKUP_PATH:-./backups}
