services:
  mysql:
    image: mysql:8.0
    container_name: chorequest-mysql
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootpassword}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-chorequest}
      - MYSQL_USER=${MYSQL_USER:-chorequest}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-chorequest}
      - TZ=${TIMEZONE:-UTC}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    networks:
      - chorequest-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "$$MYSQL_USER", "-p$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "com.chorequest.service=database"
      - "com.chorequest.environment=production"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        compress: "true"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: ${DOCKER_API_IMAGE:-chorequest-api:latest}
    container_name: chorequest-api
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER:-chorequest}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-chorequest}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-chorequest}
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production}
      - TZ=${TIMEZONE:-UTC}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /usr/bin/docker:/usr/bin/docker:ro
      - ./scripts:/app/scripts:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - chorequest-network
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --no-verbose --tries=1 -O- http://127.0.0.1:3000/api/health 2>&1 | grep -q 'status'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.chorequest.service=api"
      - "com.chorequest.environment=production"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        compress: "true"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  chorequest:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
        - VITE_API_URL=/api
        - VITE_APP_VERSION=${VITE_APP_VERSION:-1.0.0}
    image: ${DOCKER_IMAGE:-chorequest:latest}
    container_name: chorequest-app
    restart: always
    ports:
      - "${CHOREQUEST_PORT:-8080}:80"
    environment:
      - NODE_ENV=production
      - TZ=${TIMEZONE:-UTC}
    volumes:
      - chorequest-data:/usr/share/nginx/html/data
      - chorequest-backups:/backups:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - chorequest-network
    labels:
      - "com.chorequest.description=Family Chore Tracking Application"
      - "com.chorequest.version=${VITE_APP_VERSION:-1.0.0}"
      - "com.chorequest.environment=production"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        compress: "true"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  backup:
    image: alpine:latest
    container_name: chorequest-backup
    restart: unless-stopped
    volumes:
      - chorequest-data:/data:ro
      - chorequest-backups:/backups
      - ./scripts:/scripts:ro
    environment:
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-7}
      - BACKUP_SCHEDULE=${BACKUP_SCHEDULE:-0 2 * * *}
      - TZ=${TIMEZONE:-UTC}
    command: >
      sh -c "
      apk add --no-cache dcron tar gzip &&
      echo '${BACKUP_SCHEDULE:-0 2 * * *} /scripts/backup.sh' > /etc/crontabs/root &&
      crond -f -l 2
      "
    networks:
      - chorequest-network
    labels:
      - "com.chorequest.service=backup"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  chorequest-network:
    driver: bridge
    name: chorequest-network

volumes:
  chorequest-data:
    name: chorequest-data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}
  chorequest-backups:
    name: chorequest-backups
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${BACKUP_PATH:-./backups}
  mysql-data:
    name: mysql-data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${MYSQL_DATA_PATH:-./mysql-data}
