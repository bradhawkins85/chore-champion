version: '3.9'

services:
  chorequest:
    image: ${DOCKER_IMAGE:-chorequest:latest}
    container_name: chorequest-app
    restart: always
    environment:
      - NODE_ENV=production
      - TZ=${TIMEZONE:-UTC}
    volumes:
      - chorequest-data:/usr/share/nginx/html/data
      - chorequest-backups:/backups:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.chorequest.rule=Host(`${DOMAIN:-chorequest.example.com}`)"
      - "traefik.http.routers.chorequest.entrypoints=websecure"
      - "traefik.http.routers.chorequest.tls=true"
      - "traefik.http.routers.chorequest.tls.certresolver=letsencrypt"
      - "traefik.http.services.chorequest.loadbalancer.server.port=80"
      - "traefik.http.routers.chorequest-http.rule=Host(`${DOMAIN:-chorequest.example.com}`)"
      - "traefik.http.routers.chorequest-http.entrypoints=web"
      - "traefik.http.routers.chorequest-http.middlewares=https-redirect"
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.https-redirect.redirectscheme.permanent=true"
      - "com.chorequest.description=Family Chore Tracking Application"
      - "com.chorequest.version=1.0.0"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        compress: "true"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  traefik:
    image: traefik:v2.11
    container_name: chorequest-traefik
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "8888:8080"
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@example.com}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--log.level=${TRAEFIK_LOG_LEVEL:-INFO}"
      - "--accesslog=true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certs:/letsencrypt
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.${DOMAIN:-chorequest.example.com}`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls=true"
      - "traefik.http.routers.traefik.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.middlewares=traefik-auth"
      - "traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_BASIC_AUTH:-admin:$$apr1$$h5zqLWKF$$J3lV1MJmfJLVRqZPWqvqC.}"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backup:
    image: alpine:latest
    container_name: chorequest-backup
    restart: unless-stopped
    volumes:
      - chorequest-data:/data:ro
      - chorequest-backups:/backups
      - ./scripts:/scripts:ro
    environment:
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-30}
      - BACKUP_SCHEDULE=${BACKUP_SCHEDULE:-0 2 * * *}
      - TZ=${TIMEZONE:-UTC}
    command: >
      sh -c "
      apk add --no-cache dcron tar gzip &&
      echo '${BACKUP_SCHEDULE:-0 2 * * *} /scripts/backup.sh' > /etc/crontabs/root &&
      crond -f -l 2
      "
    networks:
      - traefik-public
    labels:
      - "com.chorequest.service=backup"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  traefik-public:
    name: traefik-public
    driver: bridge

volumes:
  chorequest-data:
    name: chorequest-data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}
  chorequest-backups:
    name: chorequest-backups
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${BACKUP_PATH:-./backups}
  traefik-certs:
    name: traefik-certs
    driver: local
