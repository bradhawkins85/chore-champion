version: '3.9'

services:
  chorequest:
    build:
      context: .
      dockerfile: Dockerfile
    image: chorequest:latest
    container_name: chorequest-app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - chorequest-network
    labels:
      - "com.chorequest.description=Family Chore Tracking Application"
      - "com.chorequest.version=1.0"

networks:
  chorequest-network:
    driver: bridge
