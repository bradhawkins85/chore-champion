version: '3.9'

services:
  chorequest:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
    image: chorequest:latest
    container_name: chorequest-app
    restart: unless-stopped
    ports:
      - "${CHOREQUEST_PORT:-8080}:80"
    environment:
      - NODE_ENV=production
      - TZ=${TIMEZONE:-UTC}
    volumes:
      - chorequest-data:/usr/share/nginx/html/data
      - chorequest-backups:/backups:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - chorequest-network
    labels:
      - "com.chorequest.description=Family Chore Tracking Application"
      - "com.chorequest.version=1.0.0"
      - "com.chorequest.maintainer=ChoreQuest Team"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  chorequest-network:
    driver: bridge
    name: chorequest-network

volumes:
  chorequest-data:
    name: chorequest-data
    driver: local
  chorequest-backups:
    name: chorequest-backups
    driver: local
